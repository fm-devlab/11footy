# The release of vesta-2.2.0: the parts of 2.1.0 unchanged, and team counts (step 6), pre-match:
# the keys whose verdicts passed in development (candidate 2,
# 2026-10-29-team-counts-development-candidate-2.md; the corners sides' alarm cleared by
# 2026-10-29-team-counts-alarm-check.md, accepted) and blind once
# (2026-10-29-team-counts-blind.md, both closed seasons). The corners of the match (M15.corners)
# fails calibration and stays out.
version = "2.2.0"
verdict_id = "2026-10-28-verdicts.md; 2026-10-28-blind-verdicts.md; 2026-10-28-season-development.md; 2026-10-28-season-blind.md with 2026-10-28-season-alarm-check.md; 2026-10-29-team-counts-development-candidate-2.md with 2026-10-29-team-counts-alarm-check.md; 2026-10-29-team-counts-blind.md"
what_changed = "team counts before the match: each side's corners, which side has more, the cards of the match and of each side, which side has more"

[[part]]
family_member = "spine"
competitions = ["PL", "LL", "SA", "BL", "L1"]
