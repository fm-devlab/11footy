# The release of vesta-2.7.0: the parts of 2.6.0 unchanged, and in the season part the five leagues'
# windows of family B (roadmap: streaks, next k matches), from 5 rounds on: each club's points,
# wins, losses and goals over its next 3 and next 5 league matches (T12.*.next3, .next5), the
# matches to its next loss and to its next clean sheet (T12.next_loss, T12.next_clean_sheet), and
# its season's longest winning streak, longest unbeaten run and whether it loses three in a row
# (T3). The 13 keys read league matches only (family B in writing, 1 November 2026), passed
# development (2026-10-31-season-family-windows-development.md, the T12.wins.next3 alarm cleared
# as understood) and blind once (2026-10-31-season-family-windows-blind.md,
# 2 of 2), written by the season job (`vesta.season.league_job`). Held: T12.clean_sheets.next3 and
# .next5 (not passed blind), T3.unbeaten_at_home (not passed); T13.goals.next_30_days (it reads the
# cups matrix: passed development and blind again on 2.6.0's, published only after its forward
# guard, `2026-11-01-season-family-t13-forward-guard-plan.md`); the cups' windows wait for a cups
# season job. The cups stay pre-match in this release.
version = "2.7.0"
verdict_id = "2026-10-28-verdicts.md; 2026-10-28-blind-verdicts.md; 2026-10-25-verdicts-findings.md (the cups' 2019-20 miss); 2026-10-28-season-development.md; 2026-10-28-season-blind.md with 2026-10-28-season-alarm-check.md; 2026-10-29-team-counts-development-candidate-2.md with 2026-10-29-team-counts-alarm-check.md; 2026-10-29-team-counts-blind.md; 2026-10-29-lineups-development.md with 2026-10-29-lineups-alarm-check.md; 2026-10-29-lineups-blind.md; 2026-10-30-scorers-development.md; 2026-10-30-scorers-blind.md; 2026-10-31-player-thresholds-development.md; 2026-10-31-player-thresholds-blind.md; 2026-10-31-player-thresholds-development-candidate-2.md; 2026-10-31-player-thresholds-blind-candidate-2.md; 2026-10-31-cups-ninety-minutes-development.md; 2026-10-31-live-v2-development.md; 2026-10-31-live-v2-blind.md; 2026-10-31-team-counts-leagues-development.md; 2026-10-31-team-counts-cups-development.md; 2026-10-31-team-counts-leagues-blind.md; 2026-10-31-team-counts-cups-blind.md; 2026-10-31-team-counts-leagues-development-candidate-2.md; 2026-10-31-team-counts-cups-development-candidate-2.md; 2026-10-31-team-counts-leagues-blind-candidate-2.md; 2026-10-31-team-counts-cups-blind-candidate-2.md; 2026-10-31-cups-elo-leak-recheck.md; 2026-10-31-season-family-streaks-plan.md; 2026-10-31-season-family-windows-development.md; 2026-10-31-season-family-windows-blind.md"
what_changed = "each club's next 3 and next 5 league matches (points, wins, losses, goals), the matches to its next loss and to its next clean sheet, and its season's streaks: the longest winning and unbeaten runs, three defeats in a row"

