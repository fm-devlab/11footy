# The release of vesta-2.4.0: the parts of 2.3.0 unchanged, and lineups (roadmap step 2), pre-match,
# the five leagues: each player's chance to start (L1.starts), his minutes (L6.minutes), his
# position if he starts (L9.position) and the team's formation (L2.formation.team), with the
# expected eleven (expected_elevens) of every side whose starts are published. The keys passed in
# development (2026-10-29-lineups-development.md) and blind once (2026-10-29-lineups-blind.md);
# the formation's and the position's alarm cleared by 2026-10-29-lineups-alarm-check.md, accepted
# on 29 October. L6.plays fails calibration and stays out (its candidate 2 is declared).
version = "2.4.0"
verdict_id = "2026-10-28-verdicts.md; 2026-10-28-blind-verdicts.md; 2026-10-25-verdicts-findings.md (the cups' 2019-20 miss); 2026-10-28-season-development.md; 2026-10-28-season-blind.md with 2026-10-28-season-alarm-check.md; 2026-10-29-team-counts-development-candidate-2.md with 2026-10-29-team-counts-alarm-check.md; 2026-10-29-team-counts-blind.md; 2026-10-29-lineups-development.md with 2026-10-29-lineups-alarm-check.md; 2026-10-29-lineups-blind.md"
what_changed = "lineups before the match: who starts, the minutes of each player, his position, the team's formation, and the expected eleven"

[[part]]
family_member = "spine"
competitions = ["PL", "LL", "SA", "BL", "L1"]
keys = ["M1.result", "M2.score", "M3.goals", "M4.both_score", "M5.goals.team"]
live = true

