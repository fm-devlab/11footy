# The release of vesta-2.5.0: the parts of 2.4.0 unchanged, and the scorers (roadmap step 3),
# pre-match, the five leagues, each "if he plays" (a player who does not play is void): he scores
# (P3.scores), his goals (P3.goals), he scores the match's first goal (P3.first_scorer), he assists
# (P5.assists), he scores or assists (P5.scores_or_assists), each player of the lineups' pool,
# shown beside L1.starts (FORECAST_LOG §6). The keys passed in development
# (2026-10-30-scorers-development.md) and blind once (2026-10-30-scorers-blind.md), no alarm.
version = "2.5.0"
verdict_id = "2026-10-28-verdicts.md; 2026-10-28-blind-verdicts.md; 2026-10-25-verdicts-findings.md (the cups' 2019-20 miss); 2026-10-28-season-development.md; 2026-10-28-season-blind.md with 2026-10-28-season-alarm-check.md; 2026-10-29-team-counts-development-candidate-2.md with 2026-10-29-team-counts-alarm-check.md; 2026-10-29-team-counts-blind.md; 2026-10-29-lineups-development.md with 2026-10-29-lineups-alarm-check.md; 2026-10-29-lineups-blind.md; 2026-10-30-scorers-development.md; 2026-10-30-scorers-blind.md"
what_changed = "the scorers before the match, if he plays: he scores, his goals, he scores first, he assists, he scores or assists"

