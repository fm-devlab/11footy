# The formats of the UEFA cups and the national tournaments for the season simulation (step 5,
# `vesta.season.tournament`): the phase before the knockout, the bracket rule that builds the
# knockout from its places (`vesta.season.brackets`), and the knockout rounds with their legs, the
# last the final. A competition and season without a format here is refused, never assumed. The
# order of each phase's table is the competition's row of `tie-break-rules.csv`.

[[format]]
competitions = ["CL", "EL", "ECL"]
first_season = 2024
last_season = 2099
phase = "league_phase"
advance = { round_of_16 = [1, 8], knockout_play_offs = [9, 24] }
bracket = "uefa_league_phase_2024"
# the bracket from the round of 16 to the final is set by one draw before the round of 16 is
# played: once a match of that round has kicked off, the world's pairings are the tree
fixed_from = "round_of_16"
rounds = [["knockout_play_offs", 2], ["round_of_16", 2], ["quarter_finals", 2],
          ["semi_finals", 2], ["final", 1]]
source = "UEFA competition regulations from 2024-25 (to confirm)"

[[format]]
competitions = ["CL"]
first_season = 2014
last_season = 2018
phase = "group_stage"
advance = { round_of_16 = [1, 2] }
bracket = "group_winners_v_runners_up"
rounds = [["round_of_16", 2], ["quarter_finals", 2], ["semi_finals", 2], ["final", 1]]
source = "UEFA Champions League regulations 2014-15 to 2023-24 (to confirm)"

# 2019-20: the quarter-finals on single matches in Lisbon (August 2020), the format the world's
# matches show; Art. 13.08 of the 2019/20 regulations lets UEFA play a tie in one leg
[[format]]
competitions = ["CL"]
first_season = 2019
last_season = 2019
phase = "group_stage"
advance = { round_of_16 = [1, 2] }
bracket = "group_winners_v_runners_up"
rounds = [["round_of_16", 2], ["quarter_finals", 1], ["semi_finals", 1], ["final", 1]]
neutral_rounds = ["quarter_finals", "semi_finals"]
source = "UEFA Champions League regulations 2019/20 Art. 13.08 and 15-19, read 2026-10-31; the final eight from the world's matches"

[[format]]
competitions = ["CL"]
first_season = 2020
last_season = 2023
phase = "group_stage"
advance = { round_of_16 = [1, 2] }
bracket = "group_winners_v_runners_up"
rounds = [["round_of_16", 2], ["quarter_finals", 2], ["semi_finals", 2], ["final", 1]]
source = "UEFA Champions League regulations 2014-15 to 2023-24 (to confirm)"

# The Europa League of 48 clubs: the CL's eight thirds join the round of 32, its four best seeded
# with the group winners (ranked by the CL's Art. 16.04: points, goal difference, goals for, then
# away goals, wins, away wins, discipline and the coefficient, here as lots)
[[format]]
competitions = ["EL"]
first_season = 2019
last_season = 2019
phase = "group_stage"
advance = { round_of_32 = [1, 2] }
drop_in = { from = "CL", place = 3, seeded = 4, ranking = "points|goal_difference|goals_for|lots" }
bracket = "uefa_round_of_32"
rounds = [["round_of_32", 2], ["round_of_16", 2], ["quarter_finals", 1], ["semi_finals", 1],
          ["final", 1]]
neutral_rounds = ["quarter_finals", "semi_finals"]
source = "UEFA Europa League regulations 2019/20 Art. 15.03, 17.01-17.06 and the CL's Art. 16.04, read 2026-10-31; the final eight from the world's matches (two ties of the round of 16 single matches in August 2020, here two legs)"

[[format]]
competitions = ["EL"]
first_season = 2020
last_season = 2020
phase = "group_stage"
advance = { round_of_32 = [1, 2] }
drop_in = { from = "CL", place = 3, seeded = 4, ranking = "points|goal_difference|goals_for|lots" }
bracket = "uefa_round_of_32"
rounds = [["round_of_32", 2], ["round_of_16", 2], ["quarter_finals", 2], ["semi_finals", 2],
          ["final", 1]]
source = "UEFA Europa League regulations 2019/20 Art. 15.03, 17.01-17.06, read 2026-10-31; 2020/21 the same format, as the world's matches show"

# The group stages of 2021-22 to 2023-24: the runners-up meet the higher cup's thirds in the
# knockout round play-offs, the group winners the play-offs' winners in the round of 16
[[format]]
competitions = ["EL"]
first_season = 2021
last_season = 2023
phase = "group_stage"
advance = { round_of_16 = [1, 1], knockout_play_offs = [2, 2] }
drop_in = { from = "CL", place = 3 }
bracket = "uefa_knockout_play_offs"
rounds = [["knockout_play_offs", 2], ["round_of_16", 2], ["quarter_finals", 2],
          ["semi_finals", 2], ["final", 1]]
source = "UEFA Europa League regulations 2021/22 Art. 15.03, 17-19, read 2026-10-31; 2022/23 and 2023/24 the same cycle"

[[format]]
competitions = ["ECL"]
first_season = 2021
last_season = 2023
