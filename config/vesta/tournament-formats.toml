[[format]]
competitions = ["ASIAN"]
first_season = 2027
last_season = 2027
phase = "group_stage"
advance = { round_of_16 = [1, 3] }
best_thirds = 4
thirds_ranking = "points|goal_difference|goals_for|lots"
hosts = ["Saudi Arabia"]
bracket = "afc_asian_cup_2027"
rounds = [["round_of_16", 1], ["quarter_finals", 1], ["semi_finals", 1], ["final", 1]]
source = "AFC Asian Cup Saudi Arabia 2027 Competition Regulations art. 9.2-9.12 and the AFC Competition Operations Manual 2026 Appendix 2, read 2026-10-25: 24 teams in six groups of four, the first two and the four best thirds (points, goal difference, goals for, the card score here as lots) to the round of 16, no third-place match"

[[format]]
competitions = ["UNL"]
first_season = 2026
last_season = 2026
phase = "group_stage"
advance = { quarter_finals = [1, 2] }
bracket = "group_winners_v_runners_up"
rounds = [["quarter_finals", 2], ["semi_finals", 1], ["final", 1]]
source = "Regulations of the UEFA Nations League 2026/27 art. 17, read 2026-10-25: League A's group winners drawn against runners-up of another group, two legs with the runner-up at home first; the semi-finals drawn, single matches; the third-place match reaches no round"

# The nations' tournaments judged by T6, each from its regulations read on 31 October 2026.
# Every knockout match is a
# single match on neutral ground; a host plays at home by its venue's country (the plan's
# amendment), through the strength, not the format.

[[format]]
competitions = ["AFCON"]
first_season = 2021
last_season = 2025
phase = "group_stage"
advance = { round_of_16 = [1, 3] }
best_thirds = 4
thirds_ranking = "points|goal_difference|goals_for|lots"
bracket = "fixed"
first_round = ["1D-3>1D", "2A-2C", "1A-3>1A", "2B-2F", "1B-3>1B", "1C-3>1C", "1E-2D", "1F-2E"]
later = [[[2, 1], [4, 3], [7, 6], [5, 8]], [[1, 4], [3, 2]], [[1, 2]]]
thirds_table = "six_groups"
rounds = [["round_of_16", 1], ["quarter_finals", 1], ["semi_finals", 1], ["final", 1]]
source = "Regulations of the Africa Cup of Nations art. 75.1-75.9, read 2026-10-31; the four best thirds by art. 75.4, their opponents by the table of art. 75.6"

