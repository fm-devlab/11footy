[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elevenfooty"
version = "0.1.0"
description = "11footy: Vesta's football forecasts, its desktop window and the weekly dataset."
requires-python = ">=3.12,<3.13"
dependencies = [
    "tzdata",
    "numpy>=2.5,<2.6",
    "scipy>=1.18,<1.19",
    "threadpoolctl>=3.7,<3.8",
    "lightgbm>=4.7,<4.8",
    # the window's look (Sun Valley, light and dark): pure Python and Tcl, MIT licence
    "sv-ttk>=2.6,<2.7",
]

[project.gui-scripts]
# The desktop window (src/desk): `11footy` opens it with no console window.
11footy = "desk.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the repository root, so tests import shared helpers as `tests.<suite>.<module>` under a plain
# `pytest` too; the small world and the sample log several suites build on
pythonpath = [".", "tests/fixtures"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
